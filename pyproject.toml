[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yudun"
version = "0.1.0"
description = "Camera LiDAR tracking and auxiliary risk warning research prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
vision = ["opencv-python>=4.8"]
qt = ["PyQt5>=5.15.9", "opencv-python>=4.8"]
test = ["pytest>=7"]

[project.scripts]
yudun = "yudun.cli:main"

[tool.setuptools.packages.find]
include = ["yudun*"]

[tool.setuptools.package-data]
yudun = ["configs/*.json", "qt/vendor/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
